<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="background:#141810;color:#fff;font-size:24px;padding:20px">
<h1>Тест</h1>
<button id="b" style="font-size:24px;padding:20px;width:100%">ЖМИ МЕНЯ</button>
<div id="out" style="margin-top:20px;color:#0f0">—</div>
<script>
var out=document.getElementById('out');
var log=[];
function add(s){ log.push(s); out.textContent=log.join(' | '); }
document.addEventListener('pointerdown',function(e){ if(e.target.id==='b') add('pointer'); });
document.addEventListener('touchstart',function(e){ if(e.target.id==='b') add('touch'); });
document.addEventListener('click',function(e){ if(e.target.id==='b') add('click'); });
document.getElementById('b').addEventListener('pointerdown',function(){ add('direct-pointer'); });
document.getElementById('b').addEventListener('click',function(){ add('direct-click'); });
</script>
</body></html>
