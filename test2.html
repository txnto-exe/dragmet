<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body style="background:#141810;color:#fff;font-size:18px;padding:16px">
<h1>Тест 2</h1>
<button id="b" style="font-size:22px;padding:20px;width:100%">ЖМИ</button>
<div id="out" style="margin-top:16px;color:#0f0;word-break:break-all;font-family:monospace;font-size:13px"></div>
<script>
var out=document.getElementById('out');
var log=[];
function add(s){ log.push(s); if(log.length>15)log.shift(); out.textContent=log.join('\n'); }

// эмулируем переменные как в игре
var audioCtx=null;
var audioBroken=false;
var s={settings:{sound:true,vibe:true}};

function initAudio(){
 if(audioCtx||audioBroken)return;
 try{
  var Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx){audioBroken=true;return;}
  audioCtx=new Ctx();
 }catch(e){audioBroken=true;audioCtx=null;}
}

function sndClick(){
 try{
  if(!audioCtx||!s.settings.sound)return;
  var t0=audioCtx.currentTime;
  var o=audioCtx.createOscillator();
  var g=audioCtx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(220,t0);
  o.frequency.exponentialRampToValueAtTime(80,t0+0.06);
  g.gain.setValueAtTime(0.12,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+0.08);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t0);o.stop(t0+0.1);
 }catch(e){ add('sndClick-inner-crash:'+e.message); }
}

function testHandle(e){
 if(e.target.id!=='b')return;
 add('---tap---');
 try{ initAudio(); add('initAudio ok, audioCtx='+(audioCtx?'yes':'no')+', broken='+audioBroken); }catch(err){ add('initAudio CRASH: '+err.message); }
 try{ sndClick(); add('sndClick ok'); }catch(err){ add('sndClick CRASH: '+err.message); }
 try{
  var el=document.getElementById('out');
  el.style.color='#0f0';
  add('everything ok');
 }catch(err){ add('render CRASH: '+err.message); }
}

document.addEventListener('pointerdown',testHandle,true);
document.addEventListener('touchstart',testHandle,true);
document.addEventListener('click',function(e){
 if(e.target.id==='b')add('click-fired');
},true);
</script>
</body></html>
